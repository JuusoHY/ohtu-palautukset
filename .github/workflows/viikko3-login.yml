name: Viikko 3 - WebLogin
on:
  push:
    branches: [main]
    paths:
      - 'viikko3/login/**'
      - '.github/workflows/viikko3-login.yml'
  pull_request:
    branches: [main]

jobs:
  robot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viikko3/login
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.14'
      - run: uv sync
      - run: uv run rfbrowser install --with-deps chromium
      - run: bash run_robot_tests.sh